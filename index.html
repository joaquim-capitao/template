<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queime Depois de Ler</title>
  
  <!-- Fonte Ubuntu do Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Cores baseadas na imagem fornecida */
      --bg: #1c1b24; /* Fundo escuro azulado/acinzentado */
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.06);
      --card-hover-border: rgba(243, 112, 34, 0.4);
      --card-hover-bg: rgba(243, 112, 34, 0.05);
      
      --accent: #f37022; /* Laranja dos títulos */
      --text-link: #7a8add; /* Azul suave dos links */
      --text-date: #c8b975; /* Amarelado das datas e subtítulo */
      
      --accent-glow: rgba(243, 112, 34, 0.15);
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Ubuntu', sans-serif;
      background-color: var(--bg);
      color: var(--text-link);
      min-height: 100vh;
      line-height: 1.5;
      padding: 40px 20px;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 12px;
    }
 
    .subtitle {
      color: var(--text-date);
      font-size: 1rem;
      font-weight: 400;
    }

    .section-title {
      font-size: 1.4rem;
      color: var(--accent);
      margin-bottom: 20px;
      font-weight: 700;
    }

    .chronicles-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chronicles-list a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .chronicles-list a:hover {
      transform: translateY(-2px);
      border-color: var(--card-hover-border);
      background-color: var(--card-hover-bg);
      box-shadow: 0 8px 24px -4px var(--accent-glow);
    }

    .chronicles-list .title {
      color: var(--text-link);
      font-weight: 400;
      font-size: 1.1rem;
    }

    .chronicles-list .date {
      color: var(--text-date);
      font-size: 0.9rem;
      font-weight: 400;
      white-space: nowrap;
      margin-left: 16px;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      padding-top: 30px;
    }

    .home-btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-date);
      transition: all 0.2s ease;
      padding: 10px 20px;
      border-radius: 10px;
    }

    .home-btn:hover {
      color: var(--accent);
      transform: scale(1.05);
    }

    .home-icon {
      font-size: 24px;
    }

    .home-label {
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <main class="container">
    <header>
      <h1 id="queime-depois-de-ler">TEMA</h1>
      <p class="subtitle">(Descrição)</p>
    </header>
    
    <ul class="chronicles-list">

      <li><a href="https://jw.org"><span class="title">Item 1</span><span class="date">Data</span></a></li>

    </ul>

    <footer>
      <a href="https://joaquim-capitao.github.io/" class="home-btn" title="Página Inicial">
        <span class="home-icon">🏠</span>
        <span class="home-label">Página Inicial</span>
      </a>
    </footer>

  </main>

</body>
</html>
